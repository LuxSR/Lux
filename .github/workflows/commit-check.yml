name: Commit Check

on:
  push:
    branches: [ "**" ]

jobs:
  commit-check:
    if: ${{ !contains(github.ref, 'refs/heads/dev') && !contains(github.ref, 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:  # use permissions because use of pr-comments
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for merge-base checks
      - uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: true
          author-name: true
          author-email: true
          job-summary: true
          pr-comments: false