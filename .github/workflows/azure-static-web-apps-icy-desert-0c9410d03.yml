name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    env:
      VITE_API_URL: https://backend-superdarter-d4d6d7cbefhccpd2.germanywestcentral-01.azurewebsites.net
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Verify deployment token is available
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Deployment token is unavailable to this workflow."
            exit 1
          fi
          echo "Deployment token is available."
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "dist"
