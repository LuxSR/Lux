name: Build and deploy JAR app to Azure Web App - backend-superdarter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven:
    uses: ./.github/workflows/maven.yml

  build:
    needs: maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package (tests already ran in maven job)
        run: mvn -B clean package -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    needs: [maven, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-superdarter'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_26884DECE3B54A248D485F1E98071EA2 }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check app is up
        run: |
          URL="https://backend-superdarter-d4d6d7cbefhccpd2.germanywestcentral-01.azurewebsites.net/actuator/health"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && echo "App is up" && exit 0
            sleep 15
          done
          echo "Smoke check failed"
          exit 1