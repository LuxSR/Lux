spring.application.name = dart game

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
# REVIEW(azure): this is the one line that stops the app running in a container. localhost inside a container is the container itself, not your machine and not an Azure Database for PostgreSQL. Make it spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testdartgame} so local dev keeps working and the deployment can inject the real value.
spring.datasource.url=jdbc:postgresql://localhost:5432/testdartgame
# REVIEW(config): the username is hardcoded while the password next to it is an env var. Do both the same way: ${SPRING_DATASOURCE_USERNAME:postgres}.
spring.datasource.username=postgres
# REVIEW(good): the password and the JWT secret both come from the environment, and JwtProperties validates them. This is what the other repos should be doing.
spring.datasource.password=${POSTGRES_PWD}

# REVIEW(good): ddl-auto=validate plus Flyway is the grown-up setup. Hibernate will not silently reshape the schema, and the migrations are the single source of truth.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# REVIEW(azure): no server.port here. Azure Container Apps lets you pick a target port so 8080 is fine, but Azure App Service for Containers expects the app to honour the PORT / WEBSITES_PORT variable. server.port=${PORT:8080} costs nothing and removes the surprise.
# REVIEW(azure): no health endpoint. Add spring-boot-starter-actuator and management.endpoints.web.exposure.include=health so the platform has something to probe.
# REVIEW(azure): no CORS configuration anywhere. Once the frontend is on a different Azure hostname, every browser call fails preflight. Configure it from a property rather than hardcoding the origin.
# REVIEW(azure): there is no Dockerfile and no compose file in this repo. That is the other half of the containerization work: a multi-stage build (maven:3.9-eclipse-temurin-21 to build, eclipse-temurin:21-jre to run), a non-root USER, and EXPOSE 8080.
spring.flyway.locations=classpath:db/migration
